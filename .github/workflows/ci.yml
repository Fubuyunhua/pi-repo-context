name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --registry=https://registry.npmjs.org
      - run: npm run check
      - run: npm test
      - run: npm run test:watcher
      - if: matrix.node == 24
        run: npm run test:coverage
      - if: matrix.node == 24
        run: npm run test:package
      - if: matrix.node == 24
        run: npm run test:cold-search
      - if: matrix.node == 24
        run: npm run test:pi

  cross-platform-smoke:
    name: ${{ matrix.os }} package + watcher smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - run: npm run test:watcher
